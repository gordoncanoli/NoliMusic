[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.spotify.com https://api.spotify.com https://fonts.googleapis.com https://fonts.gstatic.com; media-src 'self' blob: data:;"
    X-Frame-Options = "SAMEORIGIN"
    Access-Control-Allow-Origin = "*"
