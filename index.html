<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NoliMusic" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>NoliMusic</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0a0a0a; color: #fff; font-family: 'DM Sans', sans-serif; overflow: hidden; }
    #root { height: 100%; }
    #error-box {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #1a0000; color: #ff6b6b;
      padding: 40px 20px; font-size: 13px; font-family: monospace;
      overflow-y: auto; z-index: 9999; white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="error-box"></div>
  <div id="root"></div>
  <script>
    // Catch ALL errors and show them on screen
    window.onerror = function(msg, src, line, col, err) {
      var box = document.getElementById('error-box');
      box.style.display = 'block';
      box.textContent = 'ERROR:\n' + msg + '\n\nFile: ' + src + '\nLine: ' + line + ':' + col + '\n\nStack:\n' + (err ? err.stack : 'none');
      return false;
    };
    window.onunhandledrejection = function(e) {
      var box = document.getElementById('error-box');
      box.style.display = 'block';
      box.textContent = (box.textContent || '') + '\n\nPROMISE ERROR:\n' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : 'unknown');
    };
  </script>
  <script src="app.js"></script>
</body>
</html>
